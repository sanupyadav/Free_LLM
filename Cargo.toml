[package]
name = "freebuff2api"
version = "0.10.3"
edition = "2021"
description = "Freebuff free-model OpenAI/Anthropic-compatible API gateway (Rust edition)"
authors = ["lza6"]

[[bin]]
name = "freebuff2api"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["json", "ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
http = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (usage stats)
rusqlite = { version = "0.32", features = ["bundled"] }

# Async and tasks
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Networking
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "socks", "multipart", "cookies"] }

# Logging and config
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

# Utilities
regex = "1"
rand = "0.8"

# Embedded login window (Windows only: WebView2; gated by platform since Linux/macOS builds would fail)
[target.'cfg(windows)'.dependencies]
wry = { version = "0.57.0", default-features = false }
tao = "0.37.0"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
