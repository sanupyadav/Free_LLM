# Freebuff2API CI/CD - builds the Windows desktop installer + auto-publishes a Release
name: Build Windows Installer & Release

on:
  push:
    tags:
      - "v*"
    branches: [main]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Pinned to the same version used for local verification, to avoid the latest
          # stable clippy's new lints tripping -D warnings
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt, rust-docs

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build gateway (release)
        run: cargo build --release
        env:
          CARGO_HTTP_PROXY: "" # GitHub Actions connects directly

      - name: Run tests + clippy
        shell: bash
        env:
          CARGO_HTTP_PROXY: ""   # isolate the local .cargo/config.toml proxy (already removed from git, belt and suspenders)
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
        run: |
          set +e
          cargo test 2>&1 | tee /tmp/test.log; TEST_RC=${PIPESTATUS[0]}
          cargo test --doc 2>&1 | tee /tmp/doc.log; DOC_RC=${PIPESTATUS[0]}
          cargo clippy --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log; CLIPPY_RC=${PIPESTATUS[0]}
          echo "test rc=$TEST_RC doc rc=$DOC_RC clippy rc=$CLIPPY_RC"
          if [ "$TEST_RC" -ne 0 ]; then
            echo "::error title=cargo-test-failed::$(tail -n 40 /tmp/test.log | tr '\n' '|' | cut -c1-6000)"
          fi
          if [ "$DOC_RC" -ne 0 ]; then
            echo "::error title=cargo-doc-test-failed::$(tail -n 40 /tmp/doc.log | tr '\n' '|' | cut -c1-6000)"
          fi
          if [ "$CLIPPY_RC" -ne 0 ]; then
            echo "::error title=cargo-clippy-failed::$(grep -E '^error|^warning|-->' /tmp/clippy.log | head -30 | tr '\n' '|' | cut -c1-6000)"
          fi
          if [ "$TEST_RC" -ne 0 ] || [ "$DOC_RC" -ne 0 ] || [ "$CLIPPY_RC" -ne 0 ]; then exit 1; fi

      - name: Format check
        shell: bash
        env:
          CARGO_HTTP_PROXY: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
        run: |
          set +e
          cargo fmt --check 2>&1 | tee /tmp/fmt.log; FMT_RC=${PIPESTATUS[0]}
          echo "fmt rc=$FMT_RC"
          if [ "$FMT_RC" -ne 0 ]; then
            echo "::error title=cargo-fmt-failed::$(tail -n 40 /tmp/fmt.log | tr '\n' '|' | cut -c1-6000)"
          fi
          exit $FMT_RC

      - name: Setup Node (Electron)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build NSIS installer
        working-directory: desktop
        shell: bash
        run: |
          set +e
          npx electron-builder --win nsis --publish never 2>&1 | tee /tmp/nsis.log; RC=${PIPESTATUS[0]}
          echo "electron-builder rc=$RC"
          if [ "$RC" -ne 0 ]; then
            echo "::error title=electron-builder-failed::$(grep -iE 'error|⨯|cannot|failed|ENOENT|not found' /tmp/nsis.log | head -25 | tr '\n' '|' | cut -c1-6000)"
          fi
          exit $RC
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebuff2api-windows
          path: desktop/dist/*.exe

      - name: Create/Update Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          generate_release_notes: true

  e2e-win:
    runs-on: windows-latest
    needs: build-win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build gateway (release)
        run: cargo build --release
        env:
          CARGO_HTTP_PROXY: ""

      - name: Run panel JS syntax check
        shell: bash
        run: node tests/check_panel_js.cjs

      - name: Boot gateway + run E2E smoke
        shell: bash
        env:
          CARGO_HTTP_PROXY: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
        run: |
          set -e
          node -e "
            const fs = require('fs');
            fs.writeFileSync('config.e2e.json', JSON.stringify({
              listen_addr: '127.0.0.1:47980',
              upstream_base_url: 'https://www.codebuff.com',
              auth_tokens: [],
              api_keys: [],
              skip_upstream_check: true,
              memory_enabled: false,
              sqlite_path: 'data-e2e/freebuff2api.sqlite',
              telemetry_path: 'data-e2e/telemetry.sqlite',
              memory_path: 'data-e2e/memory.sqlite',
              skills_dir: 'data-e2e/skills',
              redact_logs: true,
              token_saver: false
            }, null, 2));
          "
          mkdir -p data-e2e
          ./target/release/freebuff2api.exe --config config.e2e.json &
          GW_PID=$!
          # Audit L6: clean up the gateway regardless of script success/failure; an explicit
          # failure on health-poll timeout instead of silently waiting forever
          trap 'taskkill //F //IM freebuff2api.exe >/dev/null 2>&1 || kill $GW_PID >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:47980/healthz >/dev/null 2>&1; then break; fi
            if [ "$i" = "90" ]; then echo "::error::gateway failed to start within 90s"; exit 1; fi
            sleep 1
          done
          # Pre-seed a fake web cookie (local pool only, triggers the health merge path; no upstream network call)
          curl -s -X POST http://127.0.0.1:47980/api/tokens/import -H "content-type: application/json" -d "{\"cookie\":\"__Secure-next-auth.session-token=e2e-fake-abc; __Host-next-auth.csrf-token=e2e\"}" >/dev/null
          node tests/e2e_phase_v0_8.cjs 47980 config.e2e.json
          node tests/e2e_phase_v0_9.cjs 47980 config.e2e.json
          kill $GW_PID 2>/dev/null || true

  coverage:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cov-${{ hashFiles('Cargo.lock') }}
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Coverage gate (>=70% lines, v0.10.3 real gate)
        # v0.10.3: locally measured TOTAL line coverage is 72.25% (cargo-llvm-cov 0.9.1 --locked, 2026-09-19).
        # This round added 22 Router-level integration cases (config/skills/memory/tokens/usage/insights/logs/doctor/export/import/prompts/threads/guide/models/web-chat/upload etc. local handlers),
        # taking api.rs coverage from 30.6% -> 45.8%. Key business modules: errors 97.9 / redact 98.5 / mcp 98.6 / telemetry 94.4 / memory 93.9 / import 92.8 / router 89.0 / web_pool 84.6 / export 84.0 / models 83.2.
        # Dragging it down: main.rs 0 (startup path), upstream 51.6 / session 65.6 / web_protocol 76.9 (network layer).
        # Improvement path (backlog): api.rs 45.8 -> 60 (add auth/routing error branches) -> overall 75% -> 80%.
        continue-on-error: false
        env:
          CARGO_HTTP_PROXY: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
        run: cargo llvm-cov --fail-under-lines 70
